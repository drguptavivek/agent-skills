name: Sync zotero-use

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-zotero-use
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out marketplace
        uses: actions/checkout@v4

      - name: Check out canonical skill
        uses: actions/checkout@v4
        with:
          repository: drguptavivek/zotero-use
          path: .canonical/zotero-use
          fetch-depth: 1

      - name: Refresh marketplace mirror
        shell: bash
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            .canonical/zotero-use/ skills/zotero-use/
          rm -rf .canonical

      - name: Verify skill discovery
        shell: bash
        run: npx -y skills add . --list | grep -q 'zotero-use'

      - name: Commit synchronized changes
        shell: bash
        run: |
          git add -A skills/zotero-use
          if git diff --cached --quiet; then
            echo "Marketplace mirror is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync zotero-use from canonical repository"
          git push
